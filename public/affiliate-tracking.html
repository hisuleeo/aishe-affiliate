<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AISHE - Redirecting...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.875rem;
      opacity: 0.9;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>AISHE</h1>
    <p>Redirecting to registration...</p>
  </div>

  <script>
    (function() {
      // URL'den ref parametresini al
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref');
      
      if (refCode) {
        // Cookie'ye kaydet (30 gün)
        const expires = new Date();
        expires.setTime(expires.getTime() + (30 * 24 * 60 * 60 * 1000));
        document.cookie = `aishe_ref=${refCode}; path=/; expires=${expires.toUTCString()}; SameSite=Lax`;
        
        console.log('Affiliate tracking:', refCode);
        
        // app.aishe.pro/register'a yönlendir
        setTimeout(() => {
          window.location.href = `https://app.aishe.pro/register?ref=${refCode}`;
        }, 500);
      } else {
        // Ref kodu yoksa ana sayfaya yönlendir
        setTimeout(() => {
          window.location.href = 'https://app.aishe.pro';
        }, 500);
      }
    })();
  </script>
</body>
</html>
